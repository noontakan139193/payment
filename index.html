<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}

body{
    background:#111;
    color:#fff;
    min-height:100vh;
}

.header{
    background:#181818;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    color:#f2c56d;
    border-bottom:1px solid #3b3222;
}

.container{
    max-width:420px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1d1d1d;
    border:1px solid #3f3628;
    border-radius:18px;
    padding:20px;
    margin-bottom:20px;
}

.bank{
    font-size:18px;
    color:#f2c56d;
    margin-bottom:10px;
}

.account{
    font-size:32px;
    font-weight:bold;
    letter-spacing:2px;
}

.name{
    color:#ccc;
    margin-top:8px;
}

.label{
    margin:20px 0 10px;
    color:#aaa;
}

input{
    width:100%;
    height:65px;
    background:#2b2b2b;
    border:none;
    border-radius:15px;
    color:#fff;
    text-align:center;
    font-size:30px;
}

button{
    width:100%;
    height:60px;
    margin-top:25px;
    border:none;
    border-radius:15px;
    font-size:22px;
    font-weight:bold;
    background:linear-gradient(#f5dc97,#d9a84a);
    color:#222;
    cursor:pointer;
}

#timer{
    margin-top:25px;
    text-align:center;
    font-size:34px;
    color:#ff5757;
    font-weight:bold;
}

.note{
    background:#1d1d1d;
    border-radius:15px;
    padding:18px;
    color:#bbb;
    line-height:1.8;
}
</style>
</head>

<body>

<div class="header">
Payment
</div>

<div class="container">

<div class="card">

<div class="bank">
บัญชีธนาคาร ทหารไทยธนชาต
</div>

<div class="account">
9247287767
</div>

<div class="name">
กัลยรัตน์ สำอางค์
</div>

<div class="label">
จำนวนเงิน
</div>

<input type="number" id="amount" placeholder="0">

<button onclick="startTimer()">
ยืนยัน
</button>

<div id="timer"></div>

</div>

<div class="note">
กรุณาตรวจสอบชื่อบัญชีและจำนวนเงินก่อนทำรายการ
</div>

</div>

<script>
let countdown;

function startTimer(){
const amount=document.getElementById("amount").value;

if(amount===""){
alert("กรุณากรอกจำนวนเงิน");
return;
}

clearInterval(countdown);

let time=600;

update();

countdown=setInterval(()=>{
time--;
update();

if(time<=0){
clearInterval(countdown);
document.getElementById("timer").innerHTML="หมดเวลา";
}

},1000);

function update(){
let m=Math.floor(time/60);
let s=time%60;

document.getElementById("timer").innerHTML=
String(m).padStart(2,"0")+":"+
String(s).padStart(2,"0");
}
}
</script>

</body>
</html>
