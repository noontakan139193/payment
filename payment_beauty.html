<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Premium</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#090909,#262626);color:#fff;padding:20px}
.card{max-width:430px;margin:auto;background:rgba(25,25,25,.96);border:1px solid #d6a947;border-radius:25px;padding:25px;box-shadow:0 0 40px #000,0 0 20px rgba(242,200,109,.25)}
.logo{text-align:center;font-size:55px}h1{text-align:center;color:#f7d477;margin:5px 0 25px;letter-spacing:2px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs label{flex:1;background:#2b2b2b;padding:12px;border-radius:12px;text-align:center;cursor:pointer;border:1px solid #555;font-size:14px}
input[type=radio]{display:none}input[type=radio]:checked+span{color:#000;background:#f7d477}.tabs span{display:block;padding:4px;border-radius:8px;color:#fff}
.box{display:none;background:#202020;border-radius:18px;padding:20px;border:1px solid #444}.active{display:block}h2{color:#f7d477;text-align:center} .info{background:#292929;padding:15px;border-radius:15px;margin:15px 0;text-align:center}b{color:#f7d477}
input{width:100%;padding:14px;border-radius:12px;border:1px solid #666;background:#111;color:#fff;margin:8px 0}.timer{text-align:center;font-size:38px;font-weight:bold;color:#ff4d4d;margin:15px}
button{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(135deg,#ffe9a3,#d79d2c);font-size:18px;font-weight:bold;cursor:pointer}
.note{text-align:center;color:#aaa;font-size:13px;margin-top:15px}
</style></head>
<body>
<div class="card">
<div class="logo">🦁</div><h1>LION PAYMENT</h1>
<div class="tabs">
<label><input type="radio" name="pay" checked onclick="show('ttb')"><span>TTB</span></label>
<label><input type="radio" name="pay" onclick="show('c2c')"><span>C2C</span></label>
<label><input type="radio" name="pay" onclick="show('slip')"><span>สลิป</span></label>
</div>
<div id="ttb" class="box active"><h2>โอนผ่าน TTB</h2><div class="info"><b>เลขบัญชี</b><br>9247287767<br><br><b>ชื่อบัญชี</b><br>กัลยรัตน์ สำอางค์</div><input type="number" placeholder="กรอกจำนวนเงิน"><div class="timer">10:00</div><button>ยืนยันการชำระ</button></div>
<div id="c2c" class="box"><h2>C2C</h2><div class="info">เลขอ้างอิง : <b>862451</b></div><div class="timer">10:00</div></div>
<div id="slip" class="box"><h2>แจ้งสลิป</h2><input type="file" accept="image/*"><div class="timer">10:00</div></div>
<div class="note">ระบบชำระเงิน • ปลอดภัย • ดีไซน์พรีเมียม</div>
</div>
<script>function show(id){document.querySelectorAll('.box').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}</script>
</body></html>
